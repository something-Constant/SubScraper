name: Run V2Ray Config Checker

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/50 * * * *"

  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write # Allows pushing commits

jobs:
  check-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall -y aiodns || true
          pip install aiohttp qrcode pillow

      - name: Create directories
        run: |
          mkdir -p Resources qrcode

      - name: Run script
        run: python main.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: config-results
          path: |
            Configs/tcp_pass/
          retention-days: 7

      - name: Commit results
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add Configs/tcp_pass/normal.txt Configs/tcp_pass/SNI_Spoofing.txt qrcode/tcp_pass_normal.png qrcode/tcp_pass_spoof.png
          git diff --quiet && git diff --staged --quiet || git commit -m "Update configs [skip ci]"
          git push
